server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;

  # API calls go to the backend service on the compose network.
  location /api/ {
    proxy_pass http://backend:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Above the backend's 600 s LLM client timeout: a long transcript extraction must reach the browser as the
    # backend's own answer (or its 502), never as an nginx 504 while the backend keeps working.
    proxy_read_timeout 630s;
    proxy_send_timeout 630s;
  }

  # Single-page app: unknown paths render index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
